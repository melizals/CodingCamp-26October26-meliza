<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Expense & Budget Visualizer - Track your daily expenses and visualize spending patterns">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="expense-budget-visualizer/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense & Budget Visualizer</h1>
    </header>

    <!-- Balance Display Section -->
    <section id="balance-display" class="balance-section">
      <h2>Total Balance</h2>
      <p id="balance-amount">Rp 0</p>
    </section>

    <!-- Transaction Form Section -->
    <section class="form-section">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" name="itemName" placeholder="Enter item name" required>
        </div>

        <div class="form-group">
          <label for="amount">Amount (Rp)</label>
          <input type="number" id="amount" name="amount" placeholder="Enter amount" min="1" step="1" required>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>

        <button type="submit">Add Transaction</button>
      </form>
      <p id="error-message" class="error-message"></p>
    </section>

    <!-- Transaction List Section -->
    <section id="transaction-list" class="transaction-section">
      <h2>Transactions</h2>
      <ul id="transaction-ul"></ul>
    </section>

    <!-- Expense Chart Section -->
    <section class="chart-section">
      <h2>Spending by Category</h2>
      <canvas id="expense-chart"></canvas>
    </section>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="expense-budget-visualizer/js/script.js"></script>
</body>
</html>
